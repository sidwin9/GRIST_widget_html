
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiche GRIST</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      border-radius: 12px;
      border: 1px solid #e3e8f0;
      overflow: hidden;
    }

    header {
      padding: 22px;
      border-bottom: 1px solid #edf0f5;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .subtitle {
      color: #667085;
      font-size: 13px;
    }

    .status {
      padding: 12px 22px;
      background: #f8f9fc;
      color: #667085;
      font-size: 12px;
      border-bottom: 1px solid #edf0f5;
    }

    #recordId {
      float: right;
    }

    #fields {
      padding: 10px 22px;
    }

    .field {
      display: grid;
      grid-template-columns: 32% 1fr;
      gap: 18px;
      padding: 14px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .name {
      font-size: 13px;
      font-weight: bold;
      color: #667085;
    }

    .value {
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: #667085;
    }

    footer {
      padding: 12px 22px;
      font-size: 11px;
      color: #98a2b3;
      border-top: 1px solid #edf0f5;
    }

    @media(max-width: 560px) {
      .field {
        grid-template-columns: 1fr;
        gap: 5px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>Fiche de l'enregistrement</h1>
    <div class="subtitle">
      Sélectionnez une ligne dans GRIST pour afficher ses informations.
    </div>
  </header>

  <div class="status">
    <span id="status">Connexion à GRIST...</span>
    <span id="recordId"></span>
  </div>

  <div id="fields" class="empty">
    En attente d'une ligne sélectionnée...
  </div>

  <footer>
    Widget GRIST · Affichage automatique de la ligne sélectionnée
  </footer>

</div>

<script>

  const fields = document.getElementById("fields");
  const status = document.getElementById("status");
  const recordId = document.getElementById("recordId");

  // Formatage des données
  function formatValue(value) {

    if (value === null || value === undefined || value === "") {
      return "—";
    }

    if (Array.isArray(value)) {
      return value.map(formatValue).join(", ");
    }

    if (typeof value === "object") {
      return JSON.stringify(value, null, 2);
    }

    if (typeof value === "boolean") {
      return value ? "Oui" : "Non";
    }

    return String(value);
  }

  // Affichage de la ligne sélectionnée
  function afficherFiche(record) {

    if (!record || !Object.keys(record).length) {
      fields.className = "empty";
      fields.textContent =
        "Aucune ligne sélectionnée dans GRIST.";
      recordId.textContent = "";
      return;
    }

    fields.className = "";
    fields.replaceChildren();

    // Identifiant de la ligne
    recordId.textContent =
      record.id !== undefined ? "ID : " + record.id : "";

    // Affichage de chaque colonne
    Object.keys(record)
      .filter(key => key !== "id")
      .forEach(key => {

        const ligne = document.createElement("div");
        ligne.className = "field";

        const nom = document.createElement("div");
        nom.className = "name";
        nom.textContent = key;

        const valeur = document.createElement("div");
        valeur.className = "value";
        valeur.textContent = formatValue(record[key]);

        ligne.appendChild(nom);
        ligne.appendChild(valeur);

        fields.appendChild(ligne);

      });

  }

  // Connexion à GRIST
  if (window.grist) {

    grist.ready({
      requiredAccess: "read table"
    });

    // Écoute de la ligne sélectionnée
    grist.onRecord(function(record) {

      status.textContent = "Connecté à GRIST";

      afficherFiche(record);

    });

  } else {

    status.textContent = "Mode aperçu";

    fields.className = "empty";
    fields.textContent =
      "Ouvrez ce fichier dans GRIST comme widget personnalisé.";

  }

</script>

</body>
</html>
